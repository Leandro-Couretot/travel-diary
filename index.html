<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅 — Mis Viajes</title>
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="drive.js"></script>
<style>

/* ─── HOME PAGE ─── */
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 3rem 1.5rem 6rem;
}

.home-intro {
  margin-bottom: 3rem;
}
.home-intro h1 {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(2rem, 5vw, 3rem);
  letter-spacing: -0.03em;
  line-height: 1.1;
  margin-bottom: 0.5rem;
}
.home-intro h1 em {
  font-style: italic;
  color: var(--accent);
}
.home-intro p {
  font-size: 0.9rem;
  color: var(--ink-muted);
}

/* ─── ALBUMS GRID ─── */
.albums-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1.5rem;
}

.album-card {
  background: var(--surface);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  text-decoration: none;
  color: inherit;
  display: block;
  animation: fadeUp 0.35s ease both;
}
.album-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
}

.album-cover {
  width: 100%;
  aspect-ratio: 3/2;
  object-fit: cover;
  display: block;
  background: var(--accent-light);
}
.album-cover-empty {
  width: 100%;
  aspect-ratio: 3/2;
  background: var(--accent-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'DM Serif Display', serif;
  font-size: 3rem;
  color: var(--accent);
  opacity: 0.5;
}

.album-info {
  padding: 1rem 1.25rem 1.25rem;
}
.album-name {
  font-family: 'DM Serif Display', serif;
  font-size: 1.2rem;
  letter-spacing: -0.01em;
  margin-bottom: 0.3rem;
  line-height: 1.2;
}
.album-dates {
  font-size: 0.75rem;
  color: var(--ink-muted);
  letter-spacing: 0.04em;
}
.album-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 0.75rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--ink-faint);
}
.album-days-count {
  font-size: 0.75rem;
  color: var(--ink-muted);
}
.album-arrow {
  font-size: 0.9rem;
  color: var(--ink-faint);
  transition: color 0.15s, transform 0.15s;
}
.album-card:hover .album-arrow { color: var(--accent); transform: translateX(3px); }

/* ─── PLAY BUTTON ─── */
.album-play-btn {
  position: absolute;
  bottom: 0.6rem;
  right: 0.6rem;
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(4px);
  border: none;
  color: white;
  font-size: 0.9rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, transform 0.15s;
  z-index: 2;
}
.album-play-btn:hover { background: rgba(0,0,0,0.8); transform: scale(1.1); }
.album-cover-wrap {
  position: relative;
  display: block;
}

/* ─── SLIDESHOW ─── */
.slideshow-overlay {
  display: none;
  position: fixed; inset: 0;
  background: #000;
  z-index: 500;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.slideshow-overlay.open { display: flex; }

.slideshow-media {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
  position: absolute; inset: 0;
}
.slideshow-video {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
  position: absolute; inset: 0;
  background: #000;
}

.slideshow-ui {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  justify-content: space-between;
  pointer-events: none;
}
.slideshow-top {
  display: flex; justify-content: flex-end; align-items: center;
  padding: 1rem 1rem 0;
  gap: 0.5rem;
  pointer-events: all;
}
.slideshow-btn {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(6px);
  border: none; color: white;
  width: 40px; height: 40px; border-radius: 50%;
  font-size: 1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.slideshow-btn:hover { background: rgba(255,255,255,0.3); }

.slideshow-bottom {
  padding: 0 1.5rem 2rem;
  pointer-events: none;
}
.slideshow-caption {
  font-size: 0.85rem;
  color: rgba(255,255,255,0.75);
  text-align: center;
  line-height: 1.5;
  margin-bottom: 0.75rem;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
}
.slideshow-progress-wrap {
  width: 100%;
  height: 2px;
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
  overflow: hidden;
}
.slideshow-progress-bar {
  height: 100%;
  background: white;
  border-radius: 2px;
  width: 0%;
  transition: width linear;
}
.slideshow-day-label {
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  text-align: center;
  margin-bottom: 0.4rem;
}

/* ─── NEW ALBUM CARD ─── */
.album-card-new {
  border: 1.5px dashed var(--ink-faint);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  cursor: pointer;
  transition: all 0.2s;
  padding: 2.5rem 1.5rem;
  min-height: 200px;
  background: none;
  animation: fadeUp 0.35s ease both;
}
.album-card-new:hover {
  border-color: var(--accent);
  background: var(--accent-light);
}
.album-card-new-icon {
  font-size: 2rem;
  opacity: 0.35;
}
.album-card-new-label {
  font-size: 0.875rem;
  color: var(--ink-muted);
  font-weight: 400;
}

/* ─── EMPTY STATE ─── */
.empty-state {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--ink-muted);
}
.empty-state-icon {
  font-size: 3rem;
  margin-bottom: 1rem;
  opacity: 0.3;
}
.empty-state h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 1.5rem;
  color: var(--ink);
  margin-bottom: 0.5rem;
}
.empty-state p { font-size: 0.9rem; margin-bottom: 1.5rem; }

/* ─── CONNECT STATE ─── */
.connect-state {
  text-align: center;
  padding: 5rem 2rem;
}
.connect-state h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 1.75rem;
  letter-spacing: -0.02em;
  margin-bottom: 0.75rem;
}
.connect-state p {
  font-size: 0.9rem;
  color: var(--ink-muted);
  max-width: 340px;
  margin: 0 auto 2rem;
  line-height: 1.7;
}

/* ─── NEW ALBUM MODAL ─── */
.modal-body { padding: 1.25rem 1.5rem 1.5rem; }

.date-range {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

/* ─── LOADING ─── */
.loading-albums {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4rem;
  gap: 0.75rem;
  color: var(--ink-muted);
  font-size: 0.875rem;
}
.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--ink-faint);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 500px) {
  main { padding: 2rem 1rem 5rem; }
  .albums-grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
  .album-info { padding: 0.75rem 1rem 1rem; }
}

/* ─── SHARE ─── */
.album-card-wrapper { position: relative; }
.album-share-btn {
  position: absolute; top: 0.5rem; right: 0.5rem; z-index: 2;
  background: rgba(0,0,0,0.4); border: none; border-radius: 4px;
  color: #fff; cursor: pointer; font-size: 0.8rem;
  padding: 0.25rem 0.5rem; line-height: 1;
  opacity: 0; transition: opacity 0.2s;
}
.album-card-wrapper:hover .album-share-btn { opacity: 1; }
@media (hover: none) { .album-share-btn { opacity: 1; } }
.album-shared-badge {
  display: inline-block; font-size: 0.65rem; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--accent); border: 1px solid var(--accent);
  border-radius: 2px; padding: 0.1rem 0.35rem; margin-bottom: 0.35rem;
}
.section-heading {
  font-family: 'DM Serif Display', serif; font-size: 1rem;
  color: var(--ink-muted); margin: 2.5rem 0 1rem;
  padding-bottom: 0.5rem; border-bottom: 1px solid var(--ink-faint);
}
</style>
</head>
<body>

<header class="app-header">
  <a href="index.html" class="app-logo">旅 <span>mis viajes</span></a>
  <div style="display:flex;gap:0.5rem;align-items:center;">
    <span style="font-size:0.7rem;color:var(--ink-faint);letter-spacing:0.04em;">v1.3</span>
    <button class="btn-drive" id="btn-drive" onclick="handleDriveBtn()">Conectar Drive</button>
  </div>
</header>

<main id="main-content">
  <div class="loading-albums">
    <div class="spinner"></div>
    Cargando...
  </div>
</main>

<!-- Modal: nuevo álbum -->
<div class="modal-overlay" id="modal-new-album">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Nuevo álbum</div>
      <button class="modal-close" onclick="closeNewAlbumModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-field">
        <label class="form-label">Nombre del viaje</label>
        <input class="form-input" id="album-name" type="text" placeholder="Ej: Japón 2026">
      </div>
      <div class="date-range">
        <div class="form-field">
          <label class="form-label">Desde</label>
          <input class="form-input" id="album-from" type="date">
        </div>
        <div class="form-field">
          <label class="form-label">Hasta</label>
          <input class="form-input" id="album-to" type="date">
        </div>
      </div>
      <div id="migrate-notice" style="display:none; font-size:0.8rem; color:var(--accent); margin-bottom:1rem; line-height:1.5;">
        ✓ Se van a migrar los días que ya tenés guardados a este álbum.
      </div>
      <div id="album-error" style="display:none; font-size:0.8rem; color:var(--red); margin-bottom:1rem;"></div>
      <button class="btn btn-primary" style="width:100%;" onclick="submitNewAlbum()">Crear álbum</button>
    </div>
  </div>
</div>

<!-- Modal: compartir álbum -->
<div class="modal-overlay" id="modal-share-album">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Compartir álbum</div>
      <button class="modal-close" onclick="closeShareModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-field">
        <label class="form-label">Email de Google</label>
        <input class="form-input" id="share-email" type="email" placeholder="lucia@gmail.com">
      </div>
      <div id="share-error" style="display:none;font-size:0.8rem;color:var(--red);margin-bottom:1rem;"></div>
      <div id="share-success" style="display:none;font-size:0.8rem;color:var(--green);margin-bottom:1rem;line-height:1.5;word-break:break-all;"></div>
      <button class="btn btn-primary" style="width:100%;" onclick="submitShare()">
        Compartir y copiar link
      </button>
    </div>
  </div>
</div>

<script>
let albums = [];
let hasMigratable = false;
let shareTargetAlbum = null;

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── DRIVE CALLBACK ──────────────────────────────────────
async function initGoogleAuth() {
  const sp          = new URLSearchParams(location.search);
  const redirectUrl = sp.get('redirect');
  const joinId      = sp.get('join');
  const joinName    = decodeURIComponent(sp.get('name') || '');
  const joinFrom    = sp.get('from') || null;
  const joinTo      = sp.get('to')   || null;

  initDrive(async () => {
    if (joinId) { await handleJoin(joinId, joinName, joinFrom, joinTo); return; }
    if (redirectUrl) { location.href = redirectUrl; return; }
    updateDriveBtn();
    await renderAlbums();
    await checkMigratable();
  });

  if (window.google && window.google.accounts) {
    window._tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: DRIVE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: async (response) => {
        if (response.error) return;
        driveToken = response.access_token;
        localStorage.setItem('drive_token', driveToken);
        localStorage.setItem('scope_version', String(SCOPE_VERSION));
        rootFolderId = await getOrCreateFolder(ROOT_FOLDER, 'root');
        if (_onConnected) { await _onConnected(); return; }
        const sp2 = new URLSearchParams(location.search);
        const jId = sp2.get('join');
        if (jId) {
          await handleJoin(jId, decodeURIComponent(sp2.get('name') || ''), sp2.get('from'), sp2.get('to'));
          return;
        }
        const rUrl = sp2.get('redirect');
        if (rUrl) { location.href = rUrl; return; }
        updateDriveBtn();
        await renderAlbums();
        await checkMigratable();
      }
    });
  }

  if (!isDriveConnected()) {
    if (joinId) renderJoinPending(joinName);
    else renderDisconnected();
  }
}

function handleDriveBtn() {
  if (isDriveConnected()) {
    if (confirm('¿Desconectar Google Drive?')) {
      disconnectDrive();
      updateDriveBtn();
      renderDisconnected();
    }
  } else {
    if (window._tokenClient) window._tokenClient.requestAccessToken();
    else alert('Google Drive no está disponible.');
  }
}

function updateDriveBtn() {
  const btn = document.getElementById('btn-drive');
  if (isDriveConnected()) {
    btn.textContent = '● Drive conectado';
    btn.classList.add('connected');
  } else {
    btn.textContent = 'Conectar Drive';
    btn.classList.remove('connected');
  }
}

// ─── CHECK MIGRATABLE ────────────────────────────────────
async function checkMigratable() {
  if (!isDriveConnected()) return;
  const folders = await listFolders(rootFolderId);
  hasMigratable = folders.some(f => /^\d{4}-\d{2}-\d{2}$/.test(f.name));
}

// ─── RENDER ──────────────────────────────────────────────
function renderDisconnected() {
  document.getElementById('main-content').innerHTML = `
    <div class="connect-state fade-up">
      <h2>Tu diario de viaje</h2>
      <p>Conectá Google Drive para acceder a tus álbumes desde cualquier dispositivo.</p>
      <button class="btn btn-primary" onclick="handleDriveBtn()">Conectar con Google Drive</button>
    </div>`;
}

function renderJoinPending(albumName) {
  document.getElementById('main-content').innerHTML = `
    <div class="connect-state fade-up">
      <h2>Invitación a álbum</h2>
      <p>Te invitaron a ver <em>${escHtml(albumName)}</em>. Conectá tu cuenta de Google para aceptar.</p>
      <button class="btn btn-primary" onclick="handleDriveBtn()">Conectar con Google Drive</button>
    </div>`;
}

async function handleJoin(folderId, albumName, dateFrom, dateTo) {
  const main = document.getElementById('main-content');
  main.innerHTML = `<div class="loading-albums"><div class="spinner"></div> Procesando invitación...</div>`;
  try {
    const result = await joinSharedAlbum(folderId, albumName, dateFrom, dateTo);
    if (!result.alreadyJoined) {
      main.innerHTML = `<div class="connect-state fade-up"><h2>Álbum agregado</h2><p>Ya podés ver <em>${escHtml(albumName)}</em> en tus álbumes compartidos.</p></div>`;
      await new Promise(r => setTimeout(r, 1400));
    }
    history.replaceState({}, '', 'index.html');
    updateDriveBtn();
    await renderAlbums();
    await checkMigratable();
  } catch(e) {
    main.innerHTML = `
      <div class="connect-state fade-up">
        <h2>No se pudo unir al álbum</h2>
        <p>${escHtml(e.message)}</p>
        <button class="btn btn-primary" onclick="location.href='index.html'">Ir a mis viajes</button>
      </div>`;
  }
}

async function renderAlbums() {
  const main = document.getElementById('main-content');
  main.innerHTML = `<div class="loading-albums"><div class="spinner"></div> Cargando álbumes...</div>`;

  const [ownAlbums, sharedData] = await Promise.all([loadAlbums(), loadSharedAlbums()]);
  albums = ownAlbums;
  const sharedAlbums = sharedData.sharedAlbums || [];

  if (!albums.length && !sharedAlbums.length) {
    main.innerHTML = `
      <div class="home-intro fade-up">
        <h1>Tus <em>viajes</em></h1>
        <p>Cada viaje es un álbum. Creá el primero para empezar.</p>
      </div>
      <div class="albums-grid">
        <button class="album-card-new" onclick="openNewAlbumModal()">
          <div class="album-card-new-icon">＋</div>
          <div class="album-card-new-label">Nuevo álbum</div>
        </button>
      </div>`;
    return;
  }

  const totalOwn = albums.length;
  main.innerHTML = `
    <div class="home-intro fade-up">
      <h1>Tus <em>viajes</em></h1>
    </div>
    <div id="section-own"></div>
    ${sharedAlbums.length ? '<div id="section-shared"></div>' : ''}`;

  // Own albums section
  const ownSection = document.getElementById('section-own');
  const ownGrid = document.createElement('div');
  ownGrid.className = 'albums-grid';
  ownSection.appendChild(ownGrid);

  albums.forEach((album, idx) => {
    const wrapper = document.createElement('div');
    wrapper.className = 'album-card-wrapper';

    const card = document.createElement('a');
    card.className = 'album-card';
    card.href = `diary.html?album=${encodeURIComponent(album.id)}`;
    card.style.animationDelay = `${idx * 0.07}s`;

    const coverSrc = album.coverFileId
      ? `https://drive.google.com/thumbnail?id=${album.coverFileId}&sz=w600`
      : null;
    const coverHtml = coverSrc
      ? `<img class="album-cover" src="${coverSrc}" alt="${escHtml(album.name)}" loading="lazy">`
      : `<div class="album-cover-empty">旅</div>`;
    const fromFmt = album.dateFrom ? formatDate(album.dateFrom) : '—';
    const toFmt   = album.dateTo   ? formatDate(album.dateTo)   : '—';

    card.innerHTML = `
      <div class="album-cover-wrap">
        ${coverHtml}
        <button class="album-play-btn" title="Ver slideshow">▶</button>
      </div>
      <div class="album-info">
        <div class="album-name">${escHtml(album.name)}</div>
        <div class="album-dates">${fromFmt} — ${toFmt}</div>
        <div class="album-meta">
          <div class="album-days-count" id="days-count-${album.id}">—</div>
          <div class="album-arrow">→</div>
        </div>
      </div>`;

    // Play button opens slideshow without navigating to diary
    card.querySelector('.album-play-btn').addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      startSlideshow(album);
    });

    const shareBtn = document.createElement('button');
    shareBtn.className = 'album-share-btn';
    shareBtn.title = 'Compartir álbum';
    shareBtn.textContent = '↗';
    shareBtn.addEventListener('click', e => openShareModal(e, album));

    wrapper.appendChild(card);
    wrapper.appendChild(shareBtn);
    ownGrid.appendChild(wrapper);
    loadDayCount(album.id);
  });

  // New album card
  const newCard = document.createElement('button');
  newCard.className = 'album-card-new';
  newCard.style.animationDelay = `${totalOwn * 0.07}s`;
  newCard.innerHTML = `<div class="album-card-new-icon">＋</div><div class="album-card-new-label">Nuevo álbum</div>`;
  newCard.onclick = openNewAlbumModal;
  ownGrid.appendChild(newCard);

  // Shared albums section
  if (sharedAlbums.length) {
    const sharedSection = document.getElementById('section-shared');
    sharedSection.innerHTML = `<h2 class="section-heading">Compartidos conmigo</h2>`;
    const sharedGrid = document.createElement('div');
    sharedGrid.className = 'albums-grid';
    sharedSection.appendChild(sharedGrid);

    sharedAlbums.forEach((album, idx) => {
      const card = document.createElement('a');
      card.className = 'album-card';
      card.href = `diary.html?sharedFolder=${encodeURIComponent(album.folderDriveId)}`;
      card.style.animationDelay = `${idx * 0.07}s`;

      const coverSrc = album.coverFileId
        ? `https://drive.google.com/thumbnail?id=${album.coverFileId}&sz=w600`
        : null;
      const coverHtml = coverSrc
        ? `<img class="album-cover" src="${coverSrc}" alt="${escHtml(album.name)}" loading="lazy">`
        : `<div class="album-cover-empty">旅</div>`;
      const fromFmt = album.dateFrom ? formatDate(album.dateFrom) : '—';
      const toFmt   = album.dateTo   ? formatDate(album.dateTo)   : '—';

      card.innerHTML = `
        ${coverHtml}
        <div class="album-info">
          <div class="album-shared-badge">Compartido</div>
          <div class="album-name">${escHtml(album.name)}</div>
          <div class="album-dates">${fromFmt} — ${toFmt}</div>
          <div class="album-meta">
            <div class="album-days-count" style="font-size:0.7rem;color:var(--ink-faint);">${escHtml(album.ownerEmail || '')}</div>
            <div class="album-arrow">→</div>
          </div>
        </div>`;
      sharedGrid.appendChild(card);
    });
  }
}

async function loadDayCount(albumId) {
  try {
    const albumFolderId = await getAlbumFolderId(albumId);
    const days = await listDayFolders(albumFolderId);
    const el = document.getElementById(`days-count-${albumId}`);
    if (el) el.textContent = days.length ? `${days.length} día${days.length > 1 ? 's' : ''}` : 'Sin días aún';
  } catch {}
}

// ─── NEW ALBUM MODAL ─────────────────────────────────────
function openNewAlbumModal() {
  if (!isDriveConnected()) {
    handleDriveBtn(); return;
  }
  document.getElementById('album-name').value = '';
  document.getElementById('album-from').value = '';
  document.getElementById('album-to').value = '';
  document.getElementById('album-error').style.display = 'none';
  document.getElementById('migrate-notice').style.display = hasMigratable ? 'block' : 'none';
  document.getElementById('modal-new-album').classList.add('open');
  setTimeout(() => document.getElementById('album-name').focus(), 100);
}

function closeNewAlbumModal() {
  document.getElementById('modal-new-album').classList.remove('open');
}

async function submitNewAlbum() {
  const name     = document.getElementById('album-name').value.trim();
  const dateFrom = document.getElementById('album-from').value;
  const dateTo   = document.getElementById('album-to').value;
  const errEl    = document.getElementById('album-error');

  if (!name) { showAlbumError('El nombre es obligatorio'); return; }

  const id = name.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  errEl.style.display = 'none';
  const btn = document.querySelector('#modal-new-album .btn-primary');
  btn.textContent = 'Creando...';
  btn.disabled = true;

  try {
    await createAlbum({ id, name, dateFrom, dateTo });

    if (hasMigratable) {
      btn.textContent = 'Migrando días...';
      const count = await migrateOldDaysToAlbum(id);
      console.log(`Migrados ${count} días`);
    }

    closeNewAlbumModal();
    await renderAlbums();
    await checkMigratable();
  } catch(e) {
    showAlbumError(e.message);
    btn.textContent = 'Crear álbum';
    btn.disabled = false;
  }
}

function showAlbumError(msg) {
  const el = document.getElementById('album-error');
  el.textContent = msg;
  el.style.display = 'block';
}

// ─── UTILS ───────────────────────────────────────────────
function formatDate(str) {
  const [y, m, d] = str.split('-');
  const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}

// ─── SHARE MODAL ─────────────────────────────────────────
function openShareModal(event, album) {
  event.preventDefault();
  event.stopPropagation();
  shareTargetAlbum = album;
  document.getElementById('share-email').value = '';
  document.getElementById('share-error').style.display = 'none';
  document.getElementById('share-success').style.display = 'none';
  document.getElementById('modal-share-album').classList.add('open');
  setTimeout(() => document.getElementById('share-email').focus(), 100);
}

function closeShareModal() {
  document.getElementById('modal-share-album').classList.remove('open');
  shareTargetAlbum = null;
}

async function submitShare() {
  const email = document.getElementById('share-email').value.trim();
  const errEl = document.getElementById('share-error');
  const okEl  = document.getElementById('share-success');
  if (!email || !email.includes('@')) {
    errEl.textContent = 'Ingresá un email válido';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';
  okEl.style.display  = 'none';
  const btn = document.querySelector('#modal-share-album .btn-primary');
  btn.textContent = 'Compartiendo...';
  btn.disabled = true;
  try {
    const folderId = await getAlbumFolderId(shareTargetAlbum.id);
    await shareAlbumWithUser(folderId, email);
    const link = generateShareLink(folderId, shareTargetAlbum.name, shareTargetAlbum.dateFrom, shareTargetAlbum.dateTo);
    try {
      await navigator.clipboard.writeText(link);
      okEl.textContent = `✓ Compartido con ${email}. Link copiado al portapapeles.`;
    } catch {
      okEl.textContent = `✓ Compartido con ${email}. Link: ${link}`;
    }
    okEl.style.display = 'block';
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
  btn.textContent = 'Compartir y copiar link';
  btn.disabled = false;
}

// Close modals on overlay click
document.getElementById('modal-new-album').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeNewAlbumModal();
});
document.getElementById('modal-share-album').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeShareModal();
});

// Wait for GSI script to load then init
(function waitForGSI() {
  if (window.google && window.google.accounts) {
    initGoogleAuth();
  } else {
    setTimeout(waitForGSI, 50);
  }
})();
</script>

<!-- ─── SLIDESHOW OVERLAY ─── -->
<div class="slideshow-overlay" id="slideshow-overlay">
  <img class="slideshow-media" id="slideshow-img" src="" alt="" style="display:none;">
  <video class="slideshow-video" id="slideshow-video" playsinline style="display:none;" muted></video>
  <div class="slideshow-ui">
    <div class="slideshow-top">
      <button class="slideshow-btn" id="slideshow-pause" title="Pausar">⏸</button>
      <button class="slideshow-btn" id="slideshow-close" title="Cerrar">✕</button>
    </div>
    <div class="slideshow-bottom">
      <div class="slideshow-day-label" id="slideshow-day-label"></div>
      <div class="slideshow-caption" id="slideshow-caption"></div>
      <div class="slideshow-progress-wrap">
        <div class="slideshow-progress-bar" id="slideshow-progress-bar"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ─── SLIDESHOW ────────────────────────────────────────────
let ssItems    = [];
let ssIdx      = 0;
let ssPaused   = false;
let ssTimer    = null;
let ssProgress = null;

async function startSlideshow(album) {
  // Collect all media (images + videos) across all days in order
  const overlay = document.getElementById('slideshow-overlay');
  overlay.classList.add('open');
  document.getElementById('slideshow-day-label').textContent = 'Cargando...';
  document.getElementById('slideshow-caption').textContent = '';
  document.getElementById('slideshow-progress-bar').style.width = '0%';

  try {
    const albumFolderId = await getAlbumFolderId(album.id);
    const dates = await listDayFolders(albumFolderId);
    const items = [];

    for (const date of dates) {
      const day = await loadDayFromDrive(albumFolderId, date);
      if (!day) continue;
      for (const m of (day.media || [])) {
        if (m.type === 'image' || m.type === 'video') {
          items.push({ ...m, date, dayTitle: day.title || '' });
        }
      }
    }

    if (!items.length) {
      closeSlideshow();
      alert('Este álbum no tiene fotos ni videos aún.');
      return;
    }

    ssItems  = items;
    ssIdx    = 0;
    ssPaused = false;
    document.getElementById('slideshow-pause').textContent = '⏸';
    showSsItem();
  } catch(e) {
    closeSlideshow();
    alert('Error al cargar el álbum: ' + e.message);
  }
}

function showSsItem() {
  clearSsTimers();
  if (ssIdx >= ssItems.length) { closeSlideshow(); return; }

  const item    = ssItems[ssIdx];
  const imgEl   = document.getElementById('slideshow-img');
  const videoEl = document.getElementById('slideshow-video');
  const bar     = document.getElementById('slideshow-progress-bar');

  // Update labels
  document.getElementById('slideshow-day-label').textContent = formatDate(item.date) + (item.dayTitle ? ` · ${item.dayTitle}` : '');
  document.getElementById('slideshow-caption').textContent = item.caption || '';

  // Reset progress
  bar.style.transition = 'none';
  bar.style.width = '0%';

  if (item.type === 'image') {
    videoEl.style.display = 'none';
    videoEl.src = '';
    imgEl.style.display = 'block';
    imgEl.style.opacity = '0';
    const src = item.driveFileId
      ? `https://drive.google.com/thumbnail?id=${item.driveFileId}&sz=w2000`
      : item.data || '';
    imgEl.src = src;
    imgEl.onload = () => {
      imgEl.style.transition = 'opacity 0.5s';
      imgEl.style.opacity = '1';
      if (!ssPaused) startPhotoTimer();
    };

  } else if (item.type === 'video') {
    imgEl.style.display = 'none';
    videoEl.style.display = 'block';
    videoEl.style.opacity = '0';
    const src = item.driveFileId
      ? `https://www.googleapis.com/drive/v3/files/${item.driveFileId}?alt=media`
      : item.data || '';

    // For Drive videos we need auth header — fetch as blob
    if (item.driveFileId) {
      fetchFileAsDataUrl(item.driveFileId).then(dataUrl => {
        videoEl.src = dataUrl;
        videoEl.style.transition = 'opacity 0.5s';
        videoEl.style.opacity = '1';
        if (!ssPaused) videoEl.play();
      }).catch(() => {
        // Skip to next on error
        ssIdx++;
        showSsItem();
      });
    } else {
      videoEl.src = src;
      videoEl.style.transition = 'opacity 0.5s';
      videoEl.style.opacity = '1';
      if (!ssPaused) videoEl.play();
    }

    videoEl.onended = () => { if (!ssPaused) { ssIdx++; showSsItem(); } };
    videoEl.ontimeupdate = () => {
      if (videoEl.duration) {
        bar.style.transition = 'none';
        bar.style.width = (videoEl.currentTime / videoEl.duration * 100) + '%';
      }
    };
  }
}

function startPhotoTimer() {
  const duration = (Math.random() * 4 + 3) * 1000; // 3–7s
  const bar = document.getElementById('slideshow-progress-bar');
  // Animate progress bar
  requestAnimationFrame(() => {
    bar.style.transition = `width ${duration}ms linear`;
    bar.style.width = '100%';
  });
  ssTimer = setTimeout(() => {
    ssIdx++;
    showSsItem();
  }, duration);
}

function clearSsTimers() {
  if (ssTimer) { clearTimeout(ssTimer); ssTimer = null; }
  const videoEl = document.getElementById('slideshow-video');
  videoEl.onended = null;
  videoEl.ontimeupdate = null;
  videoEl.pause();
}

function toggleSsPause() {
  ssPaused = !ssPaused;
  const btn     = document.getElementById('slideshow-pause');
  const videoEl = document.getElementById('slideshow-video');
  const item    = ssItems[ssIdx];
  btn.textContent = ssPaused ? '▶' : '⏸';

  if (ssPaused) {
    clearSsTimers();
    if (item?.type === 'video') videoEl.pause();
  } else {
    if (item?.type === 'image') startPhotoTimer();
    else if (item?.type === 'video') { videoEl.play(); videoEl.onended = () => { ssIdx++; showSsItem(); }; }
  }
}

function closeSlideshow() {
  clearSsTimers();
  const overlay = document.getElementById('slideshow-overlay');
  overlay.classList.remove('open');
  const videoEl = document.getElementById('slideshow-video');
  videoEl.pause();
  videoEl.src = '';
  document.getElementById('slideshow-img').src = '';
  ssItems = []; ssIdx = 0; ssPaused = false;
}

document.getElementById('slideshow-close').addEventListener('click', closeSlideshow);
document.getElementById('slideshow-pause').addEventListener('click', toggleSsPause);
document.addEventListener('keydown', e => {
  if (!document.getElementById('slideshow-overlay').classList.contains('open')) return;
  if (e.key === 'Escape') closeSlideshow();
  if (e.key === ' ') { e.preventDefault(); toggleSsPause(); }
});
</script>
</body>
</html>
